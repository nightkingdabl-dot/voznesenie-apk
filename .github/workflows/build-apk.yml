name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================
      # 1. Получаем проект
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 2. Java 17
      # =========================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================
      # 3. Android SDK
      # =========================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"


      # =========================
      # 4. Godot 4.3
      # =========================

      - name: Install Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv \
            Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot


      # =========================
      # 5. Export templates
      # =========================

      - name: Install Godot export templates
        run: |
          mkdir -p \
            ~/.local/share/godot/export_templates/4.3.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -q \
            templates.tpz \
            -d /tmp/godot_templates

          cp -r \
            /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.3.stable/


      # =========================
      # 6. Debug keystore
      # =========================

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"


      # =========================
      # 7. Настройка Godot
      # =========================

      - name: Configure Godot Android settings
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"

          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"

          export/android/force_system_user = false
          EOF


      # =========================
      # 8. ETC2 / ASTC
      # =========================

      - name: Enable Android texture compression
        run: |
          sed -i \
            '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' \
            project.godot


      # =========================
      # 9. Android export preset
      # =========================

      - name: Configure Android export preset
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Vosnesenie.apk"

          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="0.2.0"

          package/unique_name="com.vosnesenie.game"
          package/name="Vosnesenie"

          package/signed=true

          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false
          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF


      # =========================
      # 10. Проверяем настройки
      # =========================

      - name: Show Android configuration
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Godot templates:"
          ls -la ~/.local/share/godot/export_templates/4.3.stable

          echo ""
          echo "Debug keystore:"
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          echo ""
          echo "Godot editor settings:"
          cat ~/.config/godot/editor_settings-4.3.tres

          echo ""
          echo "Export preset:"
          cat export_presets.cfg


      # =========================
      # 11. Импорт проекта
      # =========================

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --path . \
            --editor \
            --quit


      # =========================
      # 12. Сборка APK
      # =========================

      - name: Build APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            build/Vosnesenie.apk


      # =========================
      # 13. Проверка APK
      # =========================

      - name: Check APK
        run: |
          echo "===== APK ====="

          ls -lh build/

          test -f build/Vosnesenie.apk

          echo ""
          echo "APK успешно создан!"
          echo "================"


      # =========================
      # 14. Загружаем APK
      # =========================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vosnesenie-APK
          path: build/Vosnesenie.apk
          if-no-files-found: error
